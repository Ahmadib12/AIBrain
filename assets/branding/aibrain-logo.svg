        <path d="M250 153 C231 144 217 153 219 170 C198 169 190 185 201 199 C184 214 191 232 211 234 C197 253 211 271 231 265 C230 285 241 294 253 292"/>
        <path d="M179 174 C194 179 198 190 201 199 M171 218 C187 216 198 224 211 234 M180 266 C198 260 211 263 231 265 M211 139 C205 151 210 162 219 170"/>
