    <radialGradient id="glow"><stop offset="0" stop-color="#148bff" stop-opacity=".3"/><stop offset="1" stop-color="#148bff" stop-opacity="0"/></radialGradient>
    <clipPath id="sphere"><circle cx="256" cy="236" r="142"/></clipPath>
