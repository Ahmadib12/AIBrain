<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 640" role="img" aria-labelledby="title desc">
  <title id="title">AIBrain — brain and globe logo</title>
  <desc id="desc">A single sphere combining a neural brain on the left and planet Earth on the right, surrounded by an orbital ring, above the AIBrain wordmark.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#75e7ff"/><stop offset=".52" stop-color="#168cff"/><stop offset="1" stop-color="#0752c7"/>
    </linearGradient>
    <linearGradient id="earth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#68dcff"/><stop offset=".48" stop-color="#1674c9"/><stop offset="1" stop-color="#082c69"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
